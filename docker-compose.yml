version: "3.8"

services:
  aeon:
    security_opt:
      - apparmor=unconfined
    image: aeon-mltb-local:latest
    container_name: aeon-mltb-app
    restart: unless-stopped
    init: true
    working_dir: /app
    environment:
      PORT: "80"
      BASE_URL_PORT: "80"
    ports:
      - "8095:80"
    volumes:
      - ./config.py:/app/config.py:ro
    stop_grace_period: 30s
